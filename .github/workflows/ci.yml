name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/khabri_test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/khabri_test"
      GEMINI_API_KEY: "dummy-gemini-key"
      OPENROUTER_API_KEY: "dummy-openrouter-key"
      SESSION_SECRET: "dummy-session-secret-at-least-32-chars-long"
      CRON_SECRET: "dummy-cron-secret"
      ADMIN_SECRET: "dummy-admin-secret"
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint codebase
        run: npm run lint

      - name: Run test suites
        run: npm run test

      - name: Build Next.js application
        run: npm run build

